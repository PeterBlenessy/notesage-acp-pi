name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish platform binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate on the test suite
        run: |
          pnpm typecheck
          pnpm test

      # `bun build --compile` cross-compiles every target from one runner, so a
      # single Linux job produces all four platform binaries.
      - name: Compile platform binaries
        run: ./scripts/build-binaries.sh

      - name: Publish release with checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/notesage-pi-acp-*.tar.gz \
            dist/notesage-pi-acp-SHA256SUMS
