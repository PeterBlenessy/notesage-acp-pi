name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish platform binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A tag that disagrees with package.json would publish assets whose
      # binaries report a different version than the release they sit on, and
      # the host pins this adapter by version. Cheaper to refuse the release
      # than to unpick a wrong one after the fact.
      - name: Refuse a tag that disagrees with package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version $tag, package.json says $pkg"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json $pkg"

      - name: Gate on the test suite
        run: |
          pnpm typecheck
          pnpm test

      # `bun build --compile` cross-compiles every target from one runner, so a
      # single Linux job produces all four platform binaries.
      - name: Compile platform binaries
        run: ./scripts/build-binaries.sh

      - name: Publish release with checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/notesage-acp-pi-*.tar.gz \
            dist/notesage-acp-pi-SHA256SUMS
