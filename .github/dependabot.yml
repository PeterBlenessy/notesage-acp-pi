version: 2
updates:
  # The runtime dependency surface is tiny (the ACP SDK) but it defines the
  # protocol this adapter speaks, so a version bump is worth seeing promptly
  # rather than discovering during a release.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The workflows pin actions by major tag; this catches the ones that move.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
